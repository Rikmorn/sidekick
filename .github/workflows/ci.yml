name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the bun that built the committed bundle
        id: bun
        run: |
          v=$(tail -n 1 plugin/bin/sidekick | sed -n 's#^// bun ##p')
          if [ -z "$v" ]; then
            echo "::error file=plugin/bin/sidekick::no '// bun <version>' footer; run bun run build and commit plugin/bin/sidekick"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: bun run check

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Run tests (bun test)
        run: bun run test

      - name: Build the plugin executable (bun build)
        run: bun run build

      - name: The committed bundle matches its source
        run: git diff --exit-code plugin/bin/sidekick

      - name: Run the built executable
        run: node plugin/bin/sidekick --version
